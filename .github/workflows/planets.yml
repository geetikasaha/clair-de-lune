name: Daily Planet Positions

on:
  schedule:
    - cron: '30 4 * * *'   # 10:00 AM IST = 04:30 UTC
  workflow_dispatch:         # Allow manual trigger from GitHub Actions tab

jobs:
  update-planets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ephem
        run: pip install ephem

      - name: Calculate planet positions
        run: python scripts/get_planets.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/planets-today.json
          if git diff --staged --quiet; then
            echo "No change in positions today."
          else
            git commit -m "chore: planet positions $(date +'%Y-%m-%d')"
            git push
          fi
